<svg width="100%" height="130" viewBox="0 0 854 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberFooterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#7e22ce"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="footerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .footer-text {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 1px;
    }
  </style>

  <!-- Animated Waving Footer Background -->
  <g transform="translate(427, 65) scale(1, -1)">
    <path fill="url(#cyberFooterGrad)" opacity="0.45">
      <animate attributeName="d" dur="16s" repeatCount="indefinite" values="
        M -427 -65 L -427 20 Q -213.5 60 0 20 T 427 30 L 427 -65 Z;
        M -427 -65 L -427 40 Q -213.5 -10 0 40 T 427 10 L 427 -65 Z;
        M -427 -65 L -427 20 Q -213.5 60 0 20 T 427 30 L 427 -65 Z" />
    </path>
    <path fill="url(#cyberFooterGrad)" opacity="0.95">
      <animate attributeName="d" dur="11s" repeatCount="indefinite" values="
        M -427 -65 L -427 15 Q -213.5 55 0 15 T 427 25 L 427 -65 Z;
        M -427 -65 L -427 35 Q -213.5 -5 0 35 T 427 5 L 427 -65 Z;
        M -427 -65 L -427 15 Q -213.5 55 0 15 T 427 25 L 427 -65 Z" />
    </path>
  </g>

  <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" class="footer-text" filter="url(#footerGlow)">
    Let's Build the Future of AI Together!
  </text>
</svg>
