<svg width="100%" height="230" viewBox="0 0 854 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberBannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="35%" stop-color="#1e1b4b"/>
      <stop offset="72%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="textNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      fill: url(#textNeon);
      letter-spacing: 3px;
      animation: fadeIn 1.4s ease-out;
    }
    .subtitle {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 600;
      fill: #e2e8f0;
      letter-spacing: 1px;
      animation: fadeIn 2s ease-out;
    }
    .accent {
      fill: #00f2fe;
      font-weight: 700;
    }
    .pulse-dot {
      animation: pulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0% { opacity: 0.25; }
      100% { opacity: 0.9; }
    }
  </style>

  <!-- Animated Waving Cyberpunk Background -->
  <g transform="translate(427, 115) scale(1, 1)">
    <path fill="url(#cyberBannerGrad)" opacity="0.45">
      <animate attributeName="d" dur="18s" repeatCount="indefinite" values="
        M -427 -115 L -427 45 Q -213.5 95 0 45 T 427 55 L 427 -115 Z;
        M -427 -115 L -427 65 Q -213.5 15 0 65 T 427 35 L 427 -115 Z;
        M -427 -115 L -427 45 Q -213.5 95 0 45 T 427 55 L 427 -115 Z" />
    </path>
    <path fill="url(#cyberBannerGrad)" opacity="0.95">
      <animate attributeName="d" dur="12s" repeatCount="indefinite" values="
        M -427 -115 L -427 35 Q -213.5 85 0 35 T 427 45 L 427 -115 Z;
        M -427 -115 L -427 60 Q -213.5 10 0 60 T 427 25 L 427 -115 Z;
        M -427 -115 L -427 35 Q -213.5 85 0 35 T 427 45 L 427 -115 Z" />
    </path>
  </g>

  <!-- Subtle Cyberpunk HUD Grid Lines & Nodes -->
  <g stroke="#00f2fe" stroke-width="0.7" opacity="0.22">
    <line x1="0" y1="30" x2="854" y2="30" stroke-dasharray="6 8"/>
    <line x1="0" y1="138" x2="854" y2="138" stroke-dasharray="4 10"/>
  </g>
  <circle cx="75" cy="30" r="3" fill="#00f2fe" class="pulse-dot" filter="url(#glow)"/>
  <circle cx="780" cy="30" r="3" fill="#ec4899" class="pulse-dot" filter="url(#glow)"/>
  <circle cx="140" cy="138" r="2.5" fill="#a855f7" class="pulse-dot"/>
  <circle cx="710" cy="138" r="2.5" fill="#00f2fe" class="pulse-dot"/>

  <!-- Main Title & Subtitle -->
  <text x="50%" y="37%" dominant-baseline="middle" text-anchor="middle" class="title" filter="url(#glow)">
    RIJUL BHATTACHARJEE
  </text>

  <text x="50%" y="61%" dominant-baseline="middle" text-anchor="middle" class="subtitle">
    Aspiring AI/ML Engineer <tspan class="accent">|</tspan> GenAI &amp; LLM Systems <tspan class="accent">|</tspan> MLOps &amp; Research
  </text>
</svg>
